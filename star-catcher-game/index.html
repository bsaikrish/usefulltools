<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Catcher</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
    body {
      min-height:100vh;
      background: linear-gradient(to bottom, #0f172a, #1e1b4b, #312e81);
      color: white;
      overflow-x:hidden;
    }

    nav {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 60px;
      background:rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      position:sticky;
      top:0;
      z-index:1000;
      text-align: left;
    }

    nav h2 {
      font-size:28px;
      font-weight:bold;
      color:#ff4d6d;
    }

    nav ul {
      display:flex;
      list-style:none;
      gap:25px;
    }

    nav ul li {
      cursor:pointer;
      font-weight:600;
      position:relative;
    }

    .dropdown {
      display:none;
      position:absolute;
      top:30px;
      left:0;
      background:white;
      padding:10px 0;
      min-width:180px;
      border-radius:12px;
      box-shadow:0 8px 20px rgba(0,0,0,0.15);
      z-index: 1001;
      text-align: left;
    }

    .dropdown a {
      display:block;
      padding:10px 20px;
      text-decoration:none;
      color:#111;
    }

    .dropdown a:hover {
      background:#f2f2f2;
    }

    .tools-menu.active .dropdown {
      display:block;
    }

    .menu-toggle {
      display:none;
      font-size:28px;
      cursor:pointer;
    }

    @media (max-width: 768px) {
      nav {
        padding:15px 20px;
        flex-wrap:wrap;
      }

      .menu-toggle {
        display:block;
      }

      nav ul {
        display:none;
        width:100%;
        flex-direction:column;
        gap:15px;
        margin-top:20px;
        background:rgba(255,255,255,0.9);
        padding:20px;
        border-radius:12px;
      }

      nav ul.show {
        display:flex;
      }

      .dropdown {
        position:static;
        box-shadow:none;
        margin-top:10px;
      }
    }

    .container {
      text-align:center;
      padding:30px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    #gameArea {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 60vh;
      border: 3px dashed #94a3b8;
      border-radius: 20px;
      margin: 20px auto;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.4);
    }

    #star {
      font-size: 60px;
      position: absolute;
      cursor: pointer;
      user-select: none;
      transition: 0.2s;
    }

    .info {
      font-size: 24px;
      margin-top: 10px;
      font-weight: bold;
    }

    button {
      padding:14px 28px;
      font-size:20px;
      border:none;
      border-radius:50px;
      cursor:pointer;
      background: linear-gradient(135deg, #ff6b6b, #ffb347);
      color:white;
      margin-top: 10px;
    }

    button:hover {
      transform: scale(1.08);
      transition:0.3s;
      background: linear-gradient(135deg, #6a5cff, #00c6ff);
    }

    .floatText {
      position: absolute;
      font-size: 28px;
      font-weight: bold;
      animation: floatUp 1s ease-out forwards;
      pointer-events: none;
      text-shadow: 0 0 10px white;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0px) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-70px) scale(1.5);
      }
    }
  </style>
</head>
<body>

<nav>
  <h2>🛠 Useful Tools</h2>
  <div class="menu-toggle" onclick="toggleMenu()">☰</div>
  <ul>
    <li><a href="../index.html" style="text-decoration:none;color:white;">Home</a></li>
    <li class="tools-menu" onclick="toggleDropdown()">Tools
      <div class="dropdown">
        <a href="../ghost-finder/index.html">👻 Ghost Finder</a>
        <a href="../toss/index.html">🪙 Toss Tool</a>
        <a href="../spin/index.html">✏ Spin Tool</a>
        <a href="../balloon-blaster-game/index.html">🎈 Balloon Blaster</a>
        <a href="../star-catcher-game/index.html">⭐ Star Catcher</a>
      </div>
    </li>
    <li><a href="../index.html#about" style="text-decoration:none;color:white;">About</a></li>
    <li><a href="../index.html#contact" style="text-decoration:none;color:white;">Contact</a></li>
  </ul>
</nav>

<div class="container">
  <h1>⭐ Star Catcher</h1>

  <div class="info">
    Score: <span id="score">0</span> |
    Time: <span id="time">60</span>s
  </div>

  <button onclick="startGame()">Start Game</button>

  <div id="gameArea">
    <div id="star">⭐</div>
  </div>
</div>

<script>
function toggleMenu() {
  document.querySelector('nav ul').classList.toggle('show');
}

function toggleDropdown() {
  document.querySelector('.tools-menu').classList.toggle('active');
}

window.addEventListener('click', function(e) {
  const menu = document.querySelector('.tools-menu');
  if (menu && !menu.contains(e.target)) {
    menu.classList.remove('active');
  }
});

let score = 0;
let time = 60;
let timer;
let gameRunning = false;

const star = document.getElementById("star");
const gameArea = document.getElementById("gameArea");
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");

function moveStar() {
  const maxX = gameArea.clientWidth - 60;
  const maxY = gameArea.clientHeight - 60;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  star.style.left = x + "px";
  star.style.top = y + "px";
}

function showFloatText(text, x, y, color) {
  const el = document.createElement("div");
  el.className = "floatText";
  el.innerText = text;
  el.style.left = x + "px";
  el.style.top = y + "px";
  el.style.color = color;

  gameArea.appendChild(el);

  setTimeout(() => el.remove(), 900);
}

star.addEventListener("click", function (e) {
  if (!gameRunning) return;

  e.stopPropagation();

  score += 10;
  scoreEl.innerText = score;

  const rect = star.getBoundingClientRect();
  const parentRect = gameArea.getBoundingClientRect();

  showFloatText(
    "+10",
    rect.left - parentRect.left + 20,
    rect.top - parentRect.top + 20,
    "lime"
  );

  moveStar();
});

gameArea.addEventListener("click", function (e) {
  if (!gameRunning) return;

  score -= 5;
  scoreEl.innerText = score;

  showFloatText(
    "-5",
    e.offsetX,
    e.offsetY,
    "red"
  );
});

function startGame() {
  score = 0;
  time = 60;
  gameRunning = true;

  scoreEl.innerText = score;
  timeEl.innerText = time;

  moveStar();

  clearInterval(timer);

  timer = setInterval(() => {
    time--;
    timeEl.innerText = time;

    if (time <= 0) {
      clearInterval(timer);
      gameRunning = false;
      alert("Game Over! Score: " + score);
    }
  }, 1000);
}
</script>

</body>
</html>
