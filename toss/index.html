<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Cricket Toss - A simple and fun coin toss tool. Flip a coin instantly for heads or tails.">
<meta name="keywords" content="cricket toss, coin toss, flip a coin, heads or tails, online coin flip, kids games">
<title>Cricket Toss</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
  body {
    min-height:100vh;
    background: linear-gradient(to bottom, #ffd6e7, #b8e7ff, #d8ffd6);
    color:#111;
    overflow-x:hidden;
  }

  nav {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 60px;
    background:rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    position:sticky;
    top:0;
  }

  nav h2 {
    font-size:28px;
    font-weight:bold;
    color:#ff4d6d;
  }

  nav ul {
    display:flex;
    list-style:none;
    gap:25px;
  }

  nav ul li {
    cursor:pointer;
    font-weight:600;
    position:relative;
  }

  .dropdown {
    display:none;
    position:absolute;
    top:30px;
    left:0;
    background:white;
    padding:10px 0;
    min-width:180px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
  }

  .dropdown a {
    display:block;
    padding:10px 20px;
    text-decoration:none;
    color:#111;
  }

  .dropdown a:hover {
    background:#f2f2f2;
  }

  .tools-menu.active .dropdown {
    display:block;
  }

  .menu-toggle {
    display:none;
    font-size:28px;
    cursor:pointer;
  }

  @media (max-width: 768px) {
    nav {
      padding:15px 20px;
      flex-wrap:wrap;
    }

    .menu-toggle {
      display:block;
    }

    nav ul {
      display:none;
      width:100%;
      flex-direction:column;
      gap:15px;
      margin-top:20px;
      background:rgba(255,255,255,0.9);
      padding:20px;
      border-radius:12px;
    }

    nav ul.show {
      display:flex;
    }

    .dropdown {
      position:static;
      box-shadow:none;
      margin-top:10px;
    }

    h1 {
      font-size:40px !important;
    }

    button {
      width:100%;
      max-width:300px;
    }
  }

  .container {
    text-align:center;
    background: transparent;
    padding:30px;
    border-radius:20px;
    box-shadow:none;
    margin-top: 50px;
  }

  h1 {
    font-size:2.5rem;
    margin-bottom:20px;
  }

  .coin {
    width: 200px;
    height: 200px;
    background: gold;
    border-radius: 50%;
    border: 8px solid #b8860b;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 35px;
    font-weight: bold;
    margin: 20px auto;
    box-shadow: 0px 5px 20px rgba(0,0,0,0.3);
  }

  .toss {
    animation: tossCoin 3s ease-in-out;
  }

  @keyframes tossCoin {
    0% { transform: translateY(0px) rotateY(0deg); }
    50% { transform: translateY(-400px) rotateY(1800deg); }
    100% { transform: translateY(0px) rotateY(3600deg); }
  }

  button {
    padding:14px 28px;
    font-size:20px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    background: linear-gradient(135deg, #ff6b6b, #ffb347);
    color:white;
  }

  button:hover {
    transform: scale(1.08);
    transition:0.3s;
    background: linear-gradient(135deg, #6a5cff, #00c6ff);
  }

  #result {
    margin-top:20px;
    font-size:28px;
    font-weight:bold;
    color: #111;
  }
</style>
</head>
<body>

<nav>
  <h2>🛠 Useful Tools</h2>
  <div class="menu-toggle" onclick="toggleMenu()">☰</div>
  <ul>
    <li><a href="../index.html" style="text-decoration:none;color:#111;">Home</a></li>
    <li class="tools-menu" onclick="toggleDropdown()">Tools
      <div class="dropdown">
        <a href="../ghost-finder/index.html">👻 Ghost Finder</a>
        <a href="../toss/index.html">🪙 Toss Tool</a>
        <a href="../spin/index.html">✏ Spin Tool</a>
        <a href="../balloon-blaster-game/index.html">🎈 Balloon Blaster</a>
        <a href="../star-catcher-game/index.html">⭐ Star Catcher</a>
      </div>
    </li>
    <li><a href="../index.html#about" style="text-decoration:none;color:#111;">About</a></li>
    <li><a href="../index.html#contact" style="text-decoration:none;color:#111;">Contact</a></li>
  </ul>
</nav>

<div class="container">
    <h1 style="font-size:70px; font-family:serif; margin-bottom:20px;">🏏 Cricket Toss</h1>
    <div class="coin" id="coin">?</div>
    <button onclick="flipCoin()">Flip Coin</button>
    <div id="result"></div>
</div>

<!-- Synthesized Coin Sounds -->
<script>
function playCoinFlipSound() {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
    osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.0);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 1.0);
  } catch(e) {}
}

function playCoinLandSound() {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1500, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.5);
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.5);
  } catch(e) {}
}
</script>

<script>
function toggleMenu() {
  document.querySelector('nav ul').classList.toggle('show');
}

function toggleDropdown() {
  document.querySelector('.tools-menu').classList.toggle('active');
}

window.addEventListener('click', function(e) {
  const menu = document.querySelector('.tools-menu');
  if (!menu.contains(e.target)) {
    menu.classList.remove('active');
  }
});

function flipCoin() {
    const coin = document.getElementById("coin");
    const result = document.getElementById("result");

    coin.innerHTML = "?";
    result.innerHTML = "Coin in Air...";
    result.style.color = "#111";

    coin.classList.add("toss");
    
    playCoinFlipSound();

    let interval = setInterval(function () {
        coin.innerHTML = Math.random() < 0.5 ? "HEAD" : "TAIL";
    }, 200);

    setTimeout(function () {
        clearInterval(interval);

        let finalResult = Math.random() < 0.5 ? "HEAD" : "TAIL";

        coin.innerHTML = finalResult;
        result.innerHTML = "Result: " + finalResult;
        result.style.color = "green";

        coin.classList.remove("toss");
        
        playCoinLandSound();
    }, 3000);
}
</script>

</body>
</html>
