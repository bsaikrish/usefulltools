<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Pencil Spin - An interactive digital pencil spinner. Just tap to spin the pencil! Fun and easy to use.">
<meta name="keywords" content="pencil spin, digital spinner, spin the pencil, fun tools, kids games, instant play">
<title>Pencil Spin</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
  body {
    min-height:100vh;
    background: linear-gradient(to bottom, #ffd6e7, #b8e7ff, #d8ffd6);
    color:#111;
    overflow-x:hidden;
  }

  nav {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 60px;
    background:rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    position:sticky;
    top:0;
    z-index:100;
  }

  nav h2 {
    font-size:28px;
    font-weight:bold;
    color:#ff4d6d;
  }

  nav ul {
    display:flex;
    list-style:none;
    gap:25px;
  }

  nav ul li {
    cursor:pointer;
    font-weight:600;
    position:relative;
  }

  .dropdown {
    display:none;
    position:absolute;
    top:30px;
    left:0;
    background:white;
    padding:10px 0;
    min-width:180px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
  }

  .dropdown a {
    display:block;
    padding:10px 20px;
    text-decoration:none;
    color:#111;
  }

  .dropdown a:hover {
    background:#f2f2f2;
  }

  .tools-menu.active .dropdown {
    display:block;
  }

  .menu-toggle {
    display:none;
    font-size:28px;
    cursor:pointer;
  }

  @media (max-width: 768px) {
    nav {
      padding:15px 20px;
      flex-wrap:wrap;
    }

    .menu-toggle {
      display:block;
    }

    nav ul {
      display:none;
      width:100%;
      flex-direction:column;
      gap:15px;
      margin-top:20px;
      background:rgba(255,255,255,0.9);
      padding:20px;
      border-radius:12px;
    }

    nav ul.show {
      display:flex;
    }

    .dropdown {
      position:static;
      box-shadow:none;
      margin-top:10px;
    }

    h1 {
      font-size:40px !important;
    }
  }

  .container {
    text-align:center;
    background: transparent;
    padding:30px;
    border-radius:20px;
    box-shadow:none;
    margin-top: 50px;
    cursor: pointer;
  }

  .spinner-container{
    position:relative;
    width:300px;
    height:300px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin: 20px auto;
  }

  .spinner{
    width:200px;
    height:20px;
    background:#222;
    border-radius:10px;
    position:absolute;
    transform-origin:center center;
    transition:transform 4s ease-out;
  }

  .spinner::after{
    content:"";
    position:absolute;
    right:-25px;
    top:0;
    width:0;
    height:0;
    border-left:30px solid #facc15;
    border-top:10px solid transparent;
    border-bottom:10px solid transparent;
  }

  .spinner::before{
    content:"";
    position:absolute;
    left:-20px;
    width:20px;
    height:20px;
    background:#ff4d6d;
    border-radius:4px;
  }

  .info{
    font-size:20px;
    color:#222;
    margin-top:20px;
  }
</style>
</head>
<body>

<nav>
  <h2>🛠 Useful Tools</h2>
  <div class="menu-toggle" onclick="toggleMenu()">☰</div>
  <ul>
    <li><a href="../index.html" style="text-decoration:none;color:#111;">Home</a></li>
    <li class="tools-menu" onclick="toggleDropdown()">Tools
      <div class="dropdown">
        <a href="../ghost-finder/index.html">👻 Ghost Finder</a>
        <a href="../toss/index.html">🪙 Toss Tool</a>
        <a href="../spin/index.html">✏ Spin Tool</a>
      </div>
    </li>
    <li><a href="../index.html#about" style="text-decoration:none;color:#111;">About</a></li>
    <li><a href="../index.html#contact" style="text-decoration:none;color:#111;">Contact</a></li>
  </ul>
</nav>

<div class="container" id="spinContainer">
  <h1 style="font-size:70px; font-family:serif; margin-bottom:20px;">✏ Spin Pencil</h1>
  
  <div class="spinner-container">
      <div class="spinner" id="spinner"></div>
  </div>

  <div class="info">Click Anywhere Here To Spin</div>
</div>

<!-- Synthesized Spin Sound -->
<script>
function playSpinSound() {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.type = 'sawtooth'; // Gives a slightly rough, whirring sound
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 4.0); // Pitch drops
    
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.1); // Quick fade in
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 4.0); // Slow fade out matching spin
    
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 4.0);
  } catch(e) {}
}
</script>

<script>
function toggleMenu() {
  document.querySelector('nav ul').classList.toggle('show');
}

function toggleDropdown() {
  document.querySelector('.tools-menu').classList.toggle('active');
}

window.addEventListener('click', function(e) {
  const menu = document.querySelector('.tools-menu');
  if (!menu.contains(e.target)) {
    menu.classList.remove('active');
  }
});

let currentRotation = 0;

document.getElementById("spinContainer").addEventListener("click", function(){
    const spinner = document.getElementById("spinner");
    let randomRotation = Math.floor(Math.random() * 360) + 1440;
    currentRotation += randomRotation;
    spinner.style.transform = `rotate(${currentRotation}deg)`;
    playSpinSound();
});
</script>

</body>
</html>
